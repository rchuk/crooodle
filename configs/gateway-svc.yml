server:
  port: 8080

spring:
  application:
    name: gateway-svc

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-svc:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
