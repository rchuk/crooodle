syntax = "proto3";

package org.ukma.spring.crooodle.svc.proto;

option java_multiple_files = true;
option java_package = "org.ukma.spring.crooodle.svc.proto";
option java_outer_classname = "UserResponseProto";

message UserResponse{

  string id  = 1;
  string name = 2;
  string email = 3;
  Role role = 4;
}

enum Role {
  ROLE_ANONYMOUS = 0;
  ROLE_TRAVELER = 1;
  ROLE_HOTEL_OWNER = 2;
  ROLE_ADMIN = 3;
}
