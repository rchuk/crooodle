syntax = "proto3";

package org.ukma.spring.crooodle.svc.proto;

option java_multiple_files = true;
option java_package = "org.ukma.spring.crooodle.svc.proto";
option java_outer_classname = "HotelResponseProto";

message HotelResponse{
  string id = 1;
  string ownerId = 2;
  string ownerName = 3;
  string name = 4;
  string address = 5;
  uint64 roomCount = 6;
}
