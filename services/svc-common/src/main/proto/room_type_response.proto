syntax = "proto3";

package org.ukma.spring.crooodle.svc.proto;

option java_multiple_files = true;
option java_package = "org.ukma.spring.crooodle.svc.proto";
option java_outer_classname = "roomTypeResponseProto";

import "hotel_response.proto";

message RoomTypeResponse{
  string id = 1;
  HotelResponse hotel = 2;
  string name = 3;
  uint32 price = 4;
}
