syntax = "proto3";

package org.ukma.spring.crooodle.svc.proto;

import "google/protobuf/timestamp.proto";
import "user_response.proto";
import "room_response.proto";
import "reservation_response.proto";

option java_multiple_files = true;
option java_package = "org.ukma.spring.crooodle.svc.proto";
option java_outer_classname = "ReservationServiceProto";

message ReservationListByUserRequest {
  string userId = 1;
}

message ReservationListByUserResponse {
  repeated ReservationResponse reservations = 1;
}

service ReservationService {
  rpc GetReservationsByUser(ReservationListByUserRequest) returns (ReservationListByUserResponse);
}
