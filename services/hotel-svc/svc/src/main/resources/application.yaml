usersvc:
  base-url: ${USER_SVC_URL:http://localhost:8081}
  api-key:  ${USER_SVC_API_KEY:${INTERNAL_API_KEY:dev-secret-change-me}}

resilience4j:
  retry:
    instances:
      usersvc:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hotel_svc}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
app:
  internal:
    api-key: ${INTERNAL_API_KEY:dev-secret-change-me}
