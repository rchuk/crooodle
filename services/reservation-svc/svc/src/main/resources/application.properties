server.port=8080
spring.datasource.url=jdbc:postgresql://reservation-svc-db:5432/reservation_svc
spring.datasource.username=${DB_USER:reservation_svc_reservation}
spring.datasource.password=${DB_PASS:password123}
spring.jpa.hibernate.ddl-auto=update
spring.cloud.openfeign.client.config.room-svc.url=http://hotel-svc:8080
spring.cloud.openfeign.client.config.user-svc.url=http://user-svc:8080
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

security.internal.api-key=${API_KEY}

logging.level.feign=DEBUG

spring.application.name=reservation-svc
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

