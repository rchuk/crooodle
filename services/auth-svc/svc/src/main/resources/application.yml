spring:
  application:
    name: auth-svc
  config:
    import: "optional:configserver:http://config-svc:8888"
  datasource:
    url: jdbc:postgresql://auth-svc-db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

grpc:
  client:
    profileService:
      address: "static://user-svc:9090"
      negotiationType: plaintext