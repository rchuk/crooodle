services:
  config-svc:
    build:
      context: .
      dockerfile: infra.Dockerfile
      args:
        MODULE_PATH: infra/config-svc
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo

  discovery-svc:
    build:
      context: .
      dockerfile: infra.Dockerfile
      args:
        MODULE_PATH: infra/discovery-svc
    ports:
      - "8761:8761"
    depends_on:
      - config-svc

  gateway-svc:
    build:
      context: .
      dockerfile: infra.Dockerfile
      args:
        MODULE_PATH: infra/gateway-svc
    ports:
      - "8080:8080"
    depends_on:
      - config-svc
      - discovery-svc

  prometheus:
    image: prom/prometheus:v3.8.0-rc.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
