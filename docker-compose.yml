services:
  discovery-svc:
    build:
      context: .
      dockerfile: infra.Dockerfile
      args:
        MODULE_PATH: infra/discovery-svc
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  config-svc:
    build:
      context: .
      dockerfile: infra.Dockerfile
      args:
        MODULE_PATH: infra/config-svc
    ports:
      - "8888:8888"
    depends_on:
      - discovery-svc
    volumes:
      - ./configs:/configs
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway-svc:
    build:
      context: .
      dockerfile: infra.Dockerfile
      args:
        MODULE_PATH: infra/gateway-svc
    ports:
      - "8080:8080"
    depends_on:
      - config-svc
      - discovery-svc
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.8.0-rc.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/19004_rev1.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
