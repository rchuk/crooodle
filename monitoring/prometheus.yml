global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'config-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-svc:8888']

  - job_name: 'discovery-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['discovery-svc:8761']

  - job_name: 'gateway-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-svc:8080']

  - job_name: 'auth-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'auth-svc:8080' ]

  - job_name: 'user-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'user-svc:8080' ]

  - job_name: 'hotel-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'hotel-svc:8080' ]

  - job_name: 'reservation-svc'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'reservation-svc:8080' ]
