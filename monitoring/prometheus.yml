global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'config-svc'
    static_configs:
      - targets: ['config-svc:8888']

  - job_name: 'discovery-svc'
    static_configs:
      - targets: ['discovery-svc:8761']

  - job_name: 'gateway-svc'
    static_configs:
      - targets: ['gateway-svc:8080']
